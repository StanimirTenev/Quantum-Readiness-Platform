name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python-tests:
    name: Python unit / API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2

      - name: Service unit / API tests
        run: |
          set -euo pipefail
          failed=0
          for d in services/*/ ; do
            if [ -d "${d}tests" ]; then
              echo "::group::${d}"
              if ! ( cd "$d" && PYTHONPATH=. python -m pytest -q ); then failed=1; fi
              echo "::endgroup::"
            fi
          done
          exit $failed

      - name: Tools tests
        run: PYTHONPATH=. python -m pytest tools/graph_projection -q

      - name: TRL7 evidence bundle consistency (LF integrity guard)
        run: python tools/evidence_pack/validate_trl7_evidence_bundle_consistency.py --repo-root .
