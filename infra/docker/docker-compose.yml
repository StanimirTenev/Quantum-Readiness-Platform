x-build-common: &build-common
  context: ../..
  dockerfile: infra/docker/Dockerfile

x-healthcheck: &healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 5s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qrp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrp}
      POSTGRES_DB: ${POSTGRES_DB:-qrp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qrp} -d ${POSTGRES_DB:-qrp}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  risk-engine:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/risk-engine
    healthcheck: *healthcheck

  crypto-fingerprint-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/crypto-fingerprint-service
    healthcheck: *healthcheck

  workflow-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/workflow-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qrp}:${POSTGRES_PASSWORD:-qrp}@postgres:5432/${POSTGRES_DB:-qrp}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *healthcheck

  scenario-engine:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/scenario-engine
    healthcheck: *healthcheck

  policy-engine:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/policy-engine
    healthcheck: *healthcheck

  evidence-normalizer:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/evidence-normalizer
    healthcheck: *healthcheck

  integration-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/integration-service
    healthcheck: *healthcheck

  pqc-readiness-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/pqc-readiness-service
    healthcheck: *healthcheck

  finding-attribution-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/finding-attribution-service
    healthcheck: *healthcheck

  graph-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/graph-service
    # No GRAPH_SNAPSHOT_PATH override: the service's own default
    # (REPO_ROOT/reports/graph/latest/graph-snapshot.json, where REPO_ROOT is
    # computed from __file__ and lands on /app inside every container -- see
    # the Dockerfile comment) resolves correctly as long as the real path is
    # mounted at that exact location.
    volumes:
      - ../../reports/graph/latest:/app/reports/graph/latest:ro
    healthcheck: *healthcheck

  inventory-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/inventory-service
    environment:
      RISK_ENGINE_URL: http://risk-engine:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-qrp}:${POSTGRES_PASSWORD:-qrp}@postgres:5432/${POSTGRES_DB:-qrp}
    depends_on:
      risk-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: *healthcheck

  planner-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/planner-service
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      WORKFLOW_SERVICE_URL: http://workflow-service:8000
    depends_on:
      inventory-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    healthcheck: *healthcheck

  retrieval-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/retrieval-service
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PLANNER_SERVICE_URL: http://planner-service:8000
      WORKFLOW_SERVICE_URL: http://workflow-service:8000
    # No DOC_INDEX_PATH override -- see the graph-service comment above for why.
    volumes:
      - ../../reports/doc-index/latest:/app/reports/doc-index/latest:ro
    depends_on:
      inventory-service:
        condition: service_healthy
      planner-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    healthcheck: *healthcheck

  copilot-service:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/copilot-service
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      RETRIEVAL_SERVICE_URL: http://retrieval-service:8000
      PLANNER_SERVICE_URL: http://planner-service:8000
      WORKFLOW_SERVICE_URL: http://workflow-service:8000
    volumes:
      - ../../reports/graph/latest:/app/reports/graph/latest:ro
    depends_on:
      inventory-service:
        condition: service_healthy
      retrieval-service:
        condition: service_healthy
      planner-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    healthcheck: *healthcheck

  api-gateway:
    build:
      <<: *build-common
      args:
        SERVICE_DIR: services/api-gateway
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # Loopback-only: reachable from this host (matches CI/local dev curling
      # 127.0.0.1 directly) but not from the public internet. The `public`
      # profile's Caddy reverse proxy talks to this container over the internal
      # Docker network (api-gateway:8000), not via this published port -- see
      # infra/docker/README.md.
      - "127.0.0.1:8000:8000"
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      RISK_ENGINE_URL: http://risk-engine:8000
      COPILOT_SERVICE_URL: http://copilot-service:8000
      SCENARIO_ENGINE_URL: http://scenario-engine:8000
      POLICY_ENGINE_URL: http://policy-engine:8000
      CRYPTO_FINGERPRINT_URL: http://crypto-fingerprint-service:8000
      EVIDENCE_NORMALIZER_URL: http://evidence-normalizer:8000
      INTEGRATION_SERVICE_URL: http://integration-service:8000
      PQC_READINESS_URL: http://pqc-readiness-service:8000
      GRAPH_SERVICE_URL: http://graph-service:8000
      FINDING_ATTRIBUTION_URL: http://finding-attribution-service:8000
      # Unset (default) -- gateway accepts unauthenticated requests, matching every
      # other service. Set on the host (`QRP_API_KEY=... docker compose up`) to
      # require an `X-API-Key` header on every route except /health, e.g. before
      # exposing this stack outside a trusted local network.
      QRP_API_KEY: ${QRP_API_KEY:-}
      # Defaults to "*" (unset here) for local dev; set CORS_ALLOW_ORIGINS in
      # .env to the real domain(s) once one is in use -- see .env.example.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    # Read-write (unlike the other services' :ro mounts of the same host
    # paths): POST /api/demo/load's demo_seed.py writes the graph snapshot
    # and doc index here (via the same REPO_ROOT-relative defaults every
    # service computes, landing on /app inside the container), plus needs
    # the Stage2 fixture files it seeds from. Every other service still only
    # reads these paths.
    volumes:
      - ../../reports/graph/latest:/app/reports/graph/latest
      - ../../reports/doc-index/latest:/app/reports/doc-index/latest
      - ../../services/inventory-service/tests/fixtures/stage2_evidence:/app/services/inventory-service/tests/fixtures/stage2_evidence:ro
    depends_on:
      inventory-service:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
      copilot-service:
        condition: service_healthy
      scenario-engine:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
      crypto-fingerprint-service:
        condition: service_healthy
      evidence-normalizer:
        condition: service_healthy
      integration-service:
        condition: service_healthy
      pqc-readiness-service:
        condition: service_healthy
      graph-service:
        condition: service_healthy
      finding-attribution-service:
        condition: service_healthy
    healthcheck: *healthcheck

  web-ui:
    image: python:3.12-slim
    working_dir: /app
    # Buildless static site (see frontend/web-ui/README.md) -- same command
    # `npm run dev` uses locally, just bound to 0.0.0.0 so the container's
    # port mapping reaches it. No build step, no Dockerfile: http.server
    # needs no dependencies to serve static files.
    command: ["python", "-m", "http.server", "5173", "--directory", "/app/public", "--bind", "0.0.0.0"]
    ports:
      # Loopback-only -- see the same note on api-gateway's ports above.
      - "127.0.0.1:5173:5173"
    volumes:
      - ../../frontend/web-ui/public:/app/public:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5173/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Opt-in reverse proxy + automatic HTTPS for exposing this stack on a real
  # public domain -- `docker compose --profile public up -d --build`. Never
  # starts otherwise (CI/local `docker compose up` don't pass --profile, so
  # this is fully inert there). See infra/docker/README.md.
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    environment:
      # DOMAIN must be set (in .env) before using this profile -- Compose
      # interpolates every service's variables at config-parse time regardless
      # of profile activation, so a required-variable (${DOMAIN:?...}) here
      # would break the default profile too. Caddy fails loudly on startup
      # instead if this is left empty.
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
      web-ui:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
