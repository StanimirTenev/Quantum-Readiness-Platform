name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python-tests:
    name: Python unit / API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2 bcrypt==4.2.0 pypdf==5.1.0

      - name: Service unit / API tests
        run: |
          set -euo pipefail
          failed=0
          for d in services/*/ ; do
            if [ -d "${d}tests" ]; then
              echo "::group::${d}"
              if ! ( cd "$d" && PYTHONPATH=. python -m pytest -q ); then failed=1; fi
              echo "::endgroup::"
            fi
          done
          exit $failed

      - name: Tools tests
        run: PYTHONPATH=. python -m pytest tools/graph_projection tools/report -q

      - name: Repo/CI scanner tests
        run: cd agents/repo-ci-scanner && PYTHONPATH=. python -m pytest -q

      - name: Doc ingestion tests
        run: cd agents/doc-ingestion && PYTHONPATH=. python -m pytest -q

  windows-evidence-smoke:
    name: Windows evidence smoke (fixture-based)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2 bcrypt==4.2.0

      - name: Run smoke
        run: bash scripts/run_windows_evidence_smoke.sh

  full-smoke:
    name: Full gateway smoke (new services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2 bcrypt==4.2.0

      - name: Run smoke
        run: bash scripts/run_full_smoke.sh

  flow-and-report:
    name: Demo flow + operator report (fixture-based)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2 bcrypt==4.2.0

      - name: Run flow
        run: bash scripts/run_flow.sh

      - name: Run report
        run: bash scripts/run_report.sh

      - name: Run report with windows evidence
        run: bash scripts/run_report.sh --windows-evidence

  evidence-to-risk-smoke:
    name: Evidence forwarded into risk-engine smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2 bcrypt==4.2.0

      - name: Run smoke
        run: bash scripts/run_evidence_to_risk_smoke.sh

  product-stack-smoke:
    name: Product stack wiring smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2 bcrypt==4.2.0 pypdf==5.1.0

      - name: Run smoke
        run: bash scripts/run_product_stack_smoke.sh

  ui-endpoints-smoke:
    name: UI-facing endpoints smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2 bcrypt==4.2.0 pypdf==5.1.0

      - name: Run smoke
        run: bash scripts/run_ui_endpoints_smoke.sh

  product-demo:
    name: One-command product demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 pydantic==2.9.2 pytest==8.3.3 httpx==0.27.2 bcrypt==4.2.0 pypdf==5.1.0

      - name: Run demo
        run: bash scripts/run_product_demo.sh

      - name: Upload demo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-demo-reports
          path: reports/product-demo/
          if-no-files-found: ignore

  web-ui:
    name: Web UI build + JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax check
        run: node --check frontend/web-ui/public/app.js

      - name: Build
        working-directory: frontend/web-ui
        run: npm run build

  go-agents:
    name: Go agents build / test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [linux-host-agent, network-scanner]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        working-directory: agents/${{ matrix.agent }}
        run: go build ./...

      - name: Test
        working-directory: agents/${{ matrix.agent }}
        run: go test ./...

  docker-compose-smoke:
    name: Docker Compose stack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        working-directory: infra/docker
        run: docker compose up -d --build

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "gateway did not become healthy in time"
          exit 1

      - name: Smoke -- ingest through gateway, score, narrate
        run: |
          set -euo pipefail
          curl -fsS -X POST http://127.0.0.1:8000/api/scans/host \
            -H "Content-Type: application/json" \
            -d '{"assets":[{"asset_type":"server","name":"ci-docker-host","criticality":4,"environment":"production","lifecycle_years":3}],"crypto_evidence":{"package_metadata":{"packages":[{"name":"openssl","algorithm":"RSA","key_size":1024}]}}}'
          # Capture the body before grepping it -- piping curl straight into
          # `grep -q` lets grep exit (and close the pipe) as soon as it finds a
          # match, which can SIGPIPE curl mid-write and fail the whole step with
          # a misleading error, even though the request itself succeeded.
          narrate_body="$(curl -fsS http://127.0.0.1:8000/api/copilot/narrate/ci-docker-host)"
          echo "$narrate_body" | grep -q '"narrative"'

      - name: Wait for web-ui health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "web-ui did not become reachable in time"
          exit 1

      - name: Smoke -- web-ui reachable and serves the console, Load Demo works end to end
        run: |
          set -euo pipefail
          # Capture each body before grepping it -- see the comment on the
          # earlier "ingest through gateway" step for why (SIGPIPE race on
          # `curl | grep -q`, not a real failure).
          index_body="$(curl -fsS http://127.0.0.1:5173/)"
          echo "$index_body" | grep -q "Quantum Readiness Console"
          curl -fsS http://127.0.0.1:5173/app.js >/dev/null
          demo_body="$(curl -fsS -X POST http://127.0.0.1:8000/api/demo/load)"
          echo "$demo_body" | grep -q '"overall":"ok"'

      - name: Compose logs (on failure)
        if: failure()
        working-directory: infra/docker
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: infra/docker
        run: docker compose down -v

  db-migrations-check:
    name: Alembic migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qrp
          POSTGRES_PASSWORD: qrp
          POSTGRES_DB: qrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrp -d qrp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: pip install alembic==1.14.0 "psycopg[binary]==3.2.3"

      - name: Run DB migration smoke (scripts/run_db_migration_smoke.sh)
        env:
          DATABASE_URL: postgresql://qrp:qrp@localhost:5432/qrp
        run: bash scripts/run_db_migration_smoke.sh

      - name: Migration smoke report (on failure)
        if: failure()
        run: cat reports/db-migration-smoke-report.md
